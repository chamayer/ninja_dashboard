<span class="pub-actions">
            {% if group.decision.approved %}
            {% if group.open_title_names %}<form method="post" action="{% url 'software_decision_bulk' %}">{% csrf_token %}{% for name in group.open_title_names %}<input type="hidden" name="canonical_name" value="{{ name }}">{% endfor %}<input type="hidden" name="scope" value="global"><input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="decision" value="approve"><button type="submit" class="btn-allow" title="Override: approve each title the publisher approval does not cover, including those with concerns" onclick="return confirm('Approve all {{ group.open_title_names|length }} open titles of this publisher, including any with concerns?');">Approve {{ group.open_title_names|length }} open title{{ group.open_title_names|length|pluralize }}</button></form>{% endif %}
            {% else %}
            <form method="post" action="{% url 'software_decision_create' %}">{% csrf_token %}<input type="hidden" name="publisher" value="{{ group.publisher }}"><input type="hidden" name="scope" value="global"><input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="decision" value="approve_publisher"><button type="submit" class="btn-trust" title="Approve every title from this publisher, now and later">Approve publisher ({{ group.titles|length }})</button></form>
            {% endif %}
            <form method="post" action="{% url 'software_decision_create' %}">{% csrf_token %}<input type="hidden" name="publisher" value="{{ group.publisher }}"><input type="hidden" name="scope" value="global"><input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="decision" value="investigate"><button type="submit" class="btn-review">Investigate publisher</button></form>
            <form method="post" action="{% url 'software_decision_create' %}">{% csrf_token %}<input type="hidden" name="publisher" value="{{ group.publisher }}"><input type="hidden" name="scope" value="global"><input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="decision" value="reject"><button type="submit" class="btn-block">Reject publisher</button></form>
        </span>
