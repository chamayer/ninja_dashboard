{% comment %}
Shared visual language for every software surface (Products,
Publishers, Decisions, Tech checklist, User risk). Include AFTER
_software_tabs.html and BEFORE any page-specific CSS. Any per-page
tweak lives inside that page's own <style> block.
{% endcomment %}
<style>
  /* ── Page header ───────────────────────────────────────── */
  .sw-page-header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 1rem; margin: 0 0 1rem;
  }
  .sw-page-header h1 { margin: 0; font-size: 1.35rem; }
  .sw-page-header .sub { color: var(--muted); font-size: 0.9rem; }

  .sw-section-label {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
    margin: 1.15rem 0 0.5rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .sw-section-label form { margin: 0; }

  /* ── Filter bar (search / dropdowns / clear) ──────────── */
  .sw-filterbar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    padding: 0.55rem 0.85rem; margin-bottom: 0.75rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .sw-filterbar label {
    font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    font-weight: 700; margin-right: 0.15rem;
  }
  .sw-filterbar input, .sw-filterbar select {
    padding: 0.35rem 0.7rem; border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.85rem; background: #fff;
  }
  .sw-filterbar button {
    padding: 0.35rem 0.85rem; font-size: 0.85rem; font-weight: 600;
    border: 1px solid var(--border); background: #fff; border-radius: 4px;
    cursor: pointer;
  }
  .sw-filterbar button:hover { border-color: var(--accent); }
  .sw-filterbar .clear {
    color: var(--muted); font-size: 0.82rem; text-decoration: none;
  }
  .sw-filterbar .clear:hover { color: var(--accent); }

  /* ── Bulk-action bar ──────────────────────────────────── */
  .sw-bulk-bar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    padding: 0.55rem 0.85rem; margin-bottom: 0.75rem;
    background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 6px;
  }
  .sw-bulk-bar strong { color: #312e81; }
  .sw-bulk-bar select {
    padding: 0.35rem 0.65rem; border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.85rem; background: #fff;
  }
  .sw-bulk-bar button {
    padding: 0.4rem 0.85rem; background: #1e40af; color: #fff;
    border: none; border-radius: 4px; font-weight: 600; cursor: pointer;
    font-size: 0.85rem;
  }
  .sw-bulk-bar button:hover { background: #1e3a8a; }
  .sw-bulk-bar .scope-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: #4338ca; margin-left: 0.5rem;
  }

  /* ── Data table ───────────────────────────────────────── */
  .sw-table-wrap { overflow-x: auto; }
  .sw-table {
    width: 100%; border-collapse: collapse; font-size: 0.9rem;
  }
  .sw-table thead th {
    padding: 0.55rem 0.7rem; text-align: left;
    color: var(--muted); font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    background: transparent;
  }
  .sw-table thead th.num { text-align: right; }
  .sw-table thead th.actions { text-align: right; white-space: nowrap; }
  .sw-table tbody td {
    padding: 0.55rem 0.7rem; vertical-align: middle;
    border-bottom: 1px solid var(--border);
  }
  .sw-table tbody tr:hover { background: #fafafa; }
  .sw-table tbody td.num { text-align: right; }
  .sw-table .primary-cell strong { font-weight: 600; color: #1a1a2e; }
  .sw-table .primary-cell .secondary {
    color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem;
  }
  .sw-table td.actions {
    text-align: right; white-space: nowrap;
  }
  .sw-table td.actions form { display: inline-flex; gap: 0.25rem; margin-left: 0.25rem; }
  .sw-table td.actions select { padding: 0.2rem 0.4rem; font-size: 0.8rem; }
  .sw-table td.actions button {
    padding: 0.2rem 0.6rem; font-size: 0.78rem;
    border: 1px solid var(--border); background: #fff; border-radius: 4px;
    cursor: pointer;
  }
  .sw-table td.actions button:hover { border-color: var(--accent); }

  /* ── Pills (Risk + Decision) ──────────────────────────── */
  .risk-pill, .decision-pill {
    display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px;
    font-size: 0.74rem; font-weight: 600; line-height: 1.3;
  }
  .risk-pill.high    { background: #fee2e2; color: #991b1b; }
  .risk-pill.medium  { background: #fef3c7; color: #92400e; }
  .risk-pill.low     { background: #dbeafe; color: #1e3a8a; }
  .risk-pill.clean   { background: #dcfce7; color: #14532d; }
  .risk-pill.unknown { background: #f3f4f6; color: #6b7280; font-weight: 500; }
  .risk-pill.none    { background: #f3f4f6; color: #6b7280; font-weight: 400; }
  .decision-pill.approve, .decision-pill.approve_publisher { background: #dcfce7; color: #166534; }
  .decision-pill.reject      { background: #fee2e2; color: #991b1b; }
  .decision-pill.investigate { background: #fef3c7; color: #92400e; }
  .decision-pill.none        { background: #f3f4f6; color: #6b7280; font-weight: 400; }

  /* ── Detail card (used on title / publisher detail) ──── */
  .sw-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 0.6rem;
  }
  .sw-card h2 { margin: 0 0 0.55rem; font-size: 1rem; }

  /* ── Empty state ──────────────────────────────────────── */
  .sw-empty {
    padding: 1.25rem; color: var(--muted); text-align: center;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: 6px; font-size: 0.9rem;
  }
</style>
