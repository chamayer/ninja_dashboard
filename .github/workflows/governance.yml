name: Governance

on:
  pull_request:
  push:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate handoff and release metadata
        shell: bash
        run: |
          test -f BLUEPRINT.md
          blueprint_chars="$(python -c 'from pathlib import Path; print(len(Path("BLUEPRINT.md").read_text(encoding="utf-8")))')"
          if [ "$blueprint_chars" -gt 4000 ]; then
            echo "Blueprint maintenance note: $blueprint_chars characters exceeds the 4,000-character guideline. Move detail to linked handoffs and records."
          fi
          grep -Eiq '^#{1,2}[[:space:]].*goal' BLUEPRINT.md
          grep -Eiq '^#{1,2}[[:space:]].*scope' BLUEPRINT.md
          grep -Eiq '^#{1,2}[[:space:]].*status' BLUEPRINT.md
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          grep -Eq "^## \[$version\]( |$)" CHANGELOG.md
